  # icon: icon.png
  # iconHeight: 35

  # analytics:
  #     google:
  #         SiteVerificationTag: "XYZabc"

  assets:
    disableHLJS: true
    # Path to the site favicon(s). Placed `selfle.png` in `static/` so these point to /selfle.png
    favicon: "/selfile.png"
    favicon16x16: "/selfile.png"
    favicon32x32: "/selfile.png"
    apple_touch_icon: "/selfile.png"
    safari_pinned_tab: "/selfile.png"

  # cover:
  #     hidden: true # hide everywhere but not in structured data
  #     hiddenInList: true # hide on list pages and home
  #     hiddenInSingle: true # hide on single page

