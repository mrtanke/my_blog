baseURL: https://mrtanke.github.io/
languageCode: en-us
title: R:Log
theme: ["PaperMod"]

# Only enable tags taxonomy. This prevents Hugo from generating category archive pages.
taxonomies:
  tag: "tags"

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papermod"]

minify:
  disableXML: true
  # minifyOutput: true


outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  author: "Author: Tan Ke"

  defaultTheme: auto
  disableThemeToggle: false
  ShowShareButtons: false
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: false
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  hideFooter: false
  footer:
    text: "Learn from [Lil’Log](https://lilianweng.github.io/)"
  # comments: false

  homeInfoParams:
    Title: "Tan Ke"
    Content: >
      I'm a second-year Data and Computer Science Master student at [Heidelberg University,](https://www.uni-heidelberg.de/) supervised by [Sara.](https://scholar.google.de/citations?user=_uZR6pEAAAAJ&hl=de)
      Since 2025, I have been documenting my studying and research notes on this blog.
      I am broadly interested in Robotics, with a current focus on world models.
      
      - -

      - I am looking for master thesis opportunities in embodied intelligence, Vision-Language-Action (VLA) models, and world models.
      If you are interested in collaboration or have relevant opportunities to share, please feel free to reach out by [email.](mailto:mrtanke2024@gmail.com)

    Image: "/selfie.png"
    ImageAlt: "Portrait photo of Tan Ke"

  socialIcons:
    - name: github
      title: View Source on Github
      url: "https://github.com/mrtanke"
    - name: KoFi
      title: Buy me a Ko-Fi :)
      url: "https://ko-fi.com/ke_tan"


  # label:
  # iconSVG: '<svg xmlns="http://www.w3.org/2000/svg" height="25" viewBox="0 -960 960 960" fill="currentColor"><path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"/></svg>'
