<span id="visitor-counter" style="display: none;">
  Visitors: <span id="busuanzi_value_site_uv"></span> | Views: <span id="busuanzi_value_site_pv"></span>
</span>

<script>
  (function () {
    function mountVisitorCounter() {
      var footer = document.querySelector("footer.footer");
      var counter = document.getElementById("visitor-counter");
      if (!footer || !counter) return;

      if (!footer.contains(counter)) {
        footer.append(" | ");
        footer.appendChild(counter);
      }
    }

    function revealCounterWhenReady() {
      var siteUv = document.getElementById("busuanzi_value_site_uv");
      var sitePv = document.getElementById("busuanzi_value_site_pv");
      var counter = document.getElementById("visitor-counter");
      if (!siteUv || !sitePv || !counter) return;

      if (siteUv.textContent.trim() && sitePv.textContent.trim()) {
        counter.style.display = "inline";
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", mountVisitorCounter);
    } else {
      mountVisitorCounter();
    }

    var counterScript = document.createElement("script");
    counterScript.src = "//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js";
    counterScript.async = true;
    counterScript.onload = function () {
      setTimeout(revealCounterWhenReady, 150);
    };
    document.body.appendChild(counterScript);
  })();
</script>
