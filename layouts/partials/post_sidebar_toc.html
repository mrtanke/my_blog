{{- $headers := findRE "<h[1-6].*?>(.|\n])+?</h[1-6]>" .Content -}}
{{- if ge (len $headers) 1 -}}
{{- $outlineID := printf "post-reading-outline-%s" .File.UniqueID -}}
<div class="post-reading-sidebar" role="complementary" aria-label="On page outline">
  <!-- <p class="post-reading-label">On this page</p> -->
  <p class="post-reading-current">{{ .Title }}</p>
  <nav id="{{ $outlineID }}" class="post-reading-outline">
    {{- .TableOfContents -}}
  </nav>
</div>
<script>
  (() => {
    const toc = document.getElementById("{{ $outlineID }}");
    if (!toc) {
      return;
    }

    const links = [...toc.querySelectorAll("a[href^='#']")];
    if (!links.length) {
      return;
    }

    const idFromHash = (hash) => decodeURIComponent(hash.slice(1));
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const getHeaderOffset = () => {
      const raw = getComputedStyle(document.documentElement).getPropertyValue("--header-height");
      const parsed = parseFloat(raw);
      return Number.isFinite(parsed) ? parsed : 60;
    };
    const getAnchorOffset = () => getHeaderOffset() + 16;
    let correctionTimer = null;
    const clearPendingCorrection = () => {
      if (correctionTimer !== null) {
        window.clearTimeout(correctionTimer);
        correctionTimer = null;
      }
    };
    const alignSectionNow = (id, behavior = "auto") => {
      const section = document.getElementById(id);
      if (!section) {
        return false;
      }
      const delta = section.getBoundingClientRect().top - getAnchorOffset();
      if (Math.abs(delta) > 4) {
        window.scrollBy({ top: delta, behavior });
      }
      return true;
    };
    const scheduleAlignmentCorrections = (id) => {
      clearPendingCorrection();
      correctionTimer = window.setTimeout(() => {
        const section = document.getElementById(id);
        if (!section) {
          return;
        }
        const delta = section.getBoundingClientRect().top - getAnchorOffset();
        if (Math.abs(delta) <= 6) {
          return;
        }
        const settleBehavior = prefersReducedMotion ? "auto" : Math.abs(delta) > 72 ? "smooth" : "auto";
        alignSectionNow(id, settleBehavior);
      }, 320);
    };
    const scrollToSection = (id, behavior) => {
      const section = document.getElementById(id);
      if (!section) {
        return false;
      }
      section.scrollIntoView({
        behavior,
        block: "start",
        inline: "nearest",
      });
      scheduleAlignmentCorrections(id);
      return true;
    };
    const sections = links
      .map((link) => {
        const id = idFromHash(link.getAttribute("href") || "");
        return id ? document.getElementById(id) : null;
      })
      .filter(Boolean);

    if (!sections.length) {
      return;
    }

    let activeId = "";
    const setActive = (id) => {
      if (!id || id === activeId) {
        return;
      }
      activeId = id;
      for (const link of links) {
        const match = idFromHash(link.getAttribute("href") || "") === id;
        link.classList.toggle("is-active", match);
      }
    };

    if ("IntersectionObserver" in window) {
      const topMargin = getHeaderOffset() + 16;
      const observer = new IntersectionObserver(
        (entries) => {
          const visible = entries
            .filter((entry) => entry.isIntersecting)
            .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
          if (visible[0]?.target?.id) {
            setActive(visible[0].target.id);
          }
        },
        {
          rootMargin: `-${topMargin}px 0px -65% 0px`,
          threshold: [0, 1],
        }
      );
      for (const section of sections) {
        observer.observe(section);
      }
    }

    for (const link of links) {
      link.addEventListener("click", (event) => {
        event.stopPropagation();
        event.stopImmediatePropagation();

        const hash = link.getAttribute("href") || "";
        const id = idFromHash(hash);
        if (!id) {
          return;
        }

        event.preventDefault();
        const behavior = prefersReducedMotion ? "auto" : "smooth";
        const moved = scrollToSection(id, behavior);
        if (!moved) {
          return;
        }

        setActive(id);
        history.pushState(null, "", `#${encodeURIComponent(id)}`);
      });
    }

    const findCurrentSection = () => {
      const targetLine = window.scrollY + getHeaderOffset() + 20;
      let current = sections[0];
      for (const section of sections) {
        if (section.offsetTop <= targetLine) {
          current = section;
        } else {
          break;
        }
      }
      if (current?.id) {
        setActive(current.id);
      }
    };

    window.addEventListener("scroll", findCurrentSection, { passive: true });
    window.addEventListener("resize", findCurrentSection);

    if (window.location.hash) {
      const id = idFromHash(window.location.hash);
      if (id) {
        const behavior = prefersReducedMotion ? "auto" : "smooth";
        requestAnimationFrame(() => {
          if (scrollToSection(id, behavior)) {
            setActive(id);
          }
        });
      }
    }

    window.addEventListener("load", () => {
      if (activeId) {
        alignSectionNow(activeId);
      }
    });

    findCurrentSection();
  })();
</script>
{{- end -}}
